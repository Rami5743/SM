  <rect x="27" y="28" width="10" height="3.6" rx="1.8" fill="#d6a53a"/>
  <rect x="27" y="35" width="10.4" height="3.6" rx="1.8" fill="#d6a53a"/>
  <rect x="27" y="42" width="10.8" height="3.6" rx="1.8" fill="#d6a53a"/>
